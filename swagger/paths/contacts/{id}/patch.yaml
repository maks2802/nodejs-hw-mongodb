tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: 'Update contact by id'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phoneNumber"
            type: string
            example: '380766788333'
          email:
            description: "Contact's email"
            type: string
            example: 'tom@mail.com'
          isFavourite:
            description: 'Whether is favourite contact'
            type: boolean
            example: false
          contactType:
            description: "Contact's contactType"
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            description: "Contact's user id"
            type: string
            example: 67f429f1eb9fa3ab45013a35
          photo:
            description: "Contact's photo"
            type: string
            format: binary
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '67bf7fc65647d93193abff72'
responses:
  '200':
    description: 'Update contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
